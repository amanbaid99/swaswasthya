name: Supabase keepalive

# Supabase pauses free-tier projects after ~7 days with no activity. This job
# issues a tiny authenticated read against the REST API so the project always
# looks active. Runs every 3 days, which is comfortably inside that window.
#
# NOTE: GitHub disables scheduled workflows on a repository that has had no
# commits for 60 days. If the repo goes quiet for that long, re-enable this
# workflow from the Actions tab (or just push any commit).

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY secrets are not set."
            exit 1
          fi

          # A real table read is what counts as database activity — a bare
          # health check against the API gateway may not be enough.
          status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 30 \
            "${SUPABASE_URL}/rest/v1/blogs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP ${status}"
          echo "Response: $(head -c 200 /tmp/body.txt)"

          # 200 = rows returned, 206 = partial content. Both mean the DB answered.
          if [ "${status}" != "200" ] && [ "${status}" != "206" ]; then
            echo "::error::Supabase did not respond as expected (HTTP ${status}). The project may already be paused."
            exit 1
          fi

          echo "Supabase project is awake."
